# Helm values for bitnami/mongodb — replica set mode
# Produces: StatefulSet + headless Service + per-pod RWO PVC

architecture: replicaset
replicaCount: 1

arbiter:
  enabled: false

auth:
  enabled: true
  rootPassword: "rootpassword123"
  usernames:
    - "taskuser"
  passwords:
    - "taskpassword123"
  databases:
    - "tasksdb"
  replicaSetKey: "replicasetkey123"

persistence:
  enabled: true
  size: 1Gi
  accessModes:
    - ReadWriteOnce

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

service:
  type: ClusterIP
