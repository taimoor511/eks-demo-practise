# Default values for the backend chart.
# Override per-environment with: helm install ... -f values-prod.yaml

namespace: backend

replicaCount: 1

image:
  repository: backend
  tag: local
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 5000
  targetPort: 5000

env:
  port: "5000"

# NAME and MONGO_URI are no longer set here. The Vault Secrets Operator syncs
# them from Vault (secret/backend/mongo) into a Secret named "backend-secrets"
# — see k8s/backend/vault-connection.yaml, vault-auth.yaml, vault-static-secret.yaml.

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi
